name: Verify public candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      pg-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnloop_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: learnloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learnloop_test -d learnloop_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://learnloop_test:ci-test-only@127.0.0.1:5432/learnloop_test
      DATABASE_URL: postgresql+asyncpg://learnloop_test:ci-test-only@127.0.0.1:5432/learnloop_test
      LEARNLOOP_ALLOW_TEST_RESET: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p learnloop-demo-ci -f docker-compose.demo.yml up -d --build
      - run: python tools/smoke_demo.py --wait
      - if: failure()
        run: docker compose -p learnloop-demo-ci -f docker-compose.demo.yml logs --tail=100
      - if: always()
        run: docker compose -p learnloop-demo-ci -f docker-compose.demo.yml down -v
