services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${LEARNLOOP_PORT:-8080}:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://learnloop:${POSTGRES_PASSWORD:?Run python tools/setup.py first}@pg:5432/learnloop
    depends_on:
      pg:
        condition: service_healthy
    volumes:
      - files:/data/files
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python tools/setup.py first}
      POSTGRES_DB: learnloop
    command: postgres -c shared_buffers=256MB -c work_mem=16MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnloop -d learnloop"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  files:
